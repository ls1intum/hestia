org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Maven Central answers bursts of downloads from shared CI runners with 429 Too Many Requests. Gradle
# retries 429, but by default only 3 attempts with 1 s and 2 s pauses. These give it 6 attempts with
# doubling pauses from 2 s (up to about 1 minute in total), so a rate limit no longer fails the
# Docker image build or the test jobs. The Docker builds run without any cache, so every build
# downloads all dependencies.
systemProp.org.gradle.internal.network.retry.max.attempts=6
systemProp.org.gradle.internal.network.retry.initial.backOff=2000
