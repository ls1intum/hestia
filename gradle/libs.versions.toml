# One place for the versions of every server and shared library in this build.
# Spring Boot's dependency management sets everything it manages (Spring, Hibernate, Flyway,
# Jackson, Testcontainers, JUnit, ...); this file only holds what Boot does not manage.

[versions]
spring-boot = "3.5.14"
spring-dependency-management = "1.1.7"
spring-ai = "1.1.6"
springdoc = "2.8.17"
pdfbox = "3.0.8"
tika = "3.3.2"
docx4j = "11.4.9"
poi = "5.2.5"
opencsv = "5.9"
archunit = "1.3.0"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-ai-bom = { module = "org.springframework.ai:spring-ai-bom", version.ref = "spring-ai" }
springdoc-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
pdfbox = { module = "org.apache.pdfbox:pdfbox", version.ref = "pdfbox" }
tika-core = { module = "org.apache.tika:tika-core", version.ref = "tika" }
tika-langdetect-optimaize = { module = "org.apache.tika:tika-langdetect-optimaize", version.ref = "tika" }
tika-parsers-standard = { module = "org.apache.tika:tika-parsers-standard-package", version.ref = "tika" }
docx4j-jaxb-referenceimpl = { module = "org.docx4j:docx4j-JAXB-ReferenceImpl", version.ref = "docx4j" }
docx4j-export-fo = { module = "org.docx4j:docx4j-export-fo", version.ref = "docx4j" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }
opencsv = { module = "com.opencsv:opencsv", version.ref = "opencsv" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
