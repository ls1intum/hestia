# ──────────────────────────────────────────────────────────────────────────────
# LOCAL DEVELOPMENT PROFILE
# Activate with: SPRING_PROFILES_ACTIVE=local
#
# WARNING: This profile bypasses SAML authentication entirely: every request is
# signed in as the same user, 'dev-local-user'.
# Used on laptops and on hestia-test (VPN-only; SAML access was only requested for
# production). It MUST NEVER be activated in production or anywhere reachable from
# outside the VPN. SecurityConfig refuses to start with 'local' and 'prod' active
# together, or inside Kubernetes/Fly.io.
# ──────────────────────────────────────────────────────────────────────────────
spring:

  flyway:
    baseline-on-migrate: true
    baseline-version: 2
