spring:
  # No default profile: the 'local' profile signs every request in as a dev user (see
  # application-local.yml), so it must be chosen explicitly and can never apply by accident.
  application:
    name: workshopper-server

  security:
    saml2:
      relyingparty:
        registration:
          tum:
            signing:
              credentials:
                - private-key-location: ${SAML_PRIVATE_KEY_LOCATION:classpath:certs/private-key.pem}
                  certificate-location: ${SAML_CERTIFICATE_LOCATION:classpath:certs/certificate.crt}

            decryption:
              credentials:
                - private-key-location: ${SAML_PRIVATE_KEY_LOCATION:classpath:certs/private-key.pem}
                  certificate-location: ${SAML_CERTIFICATE_LOCATION:classpath:certs/certificate.crt}
            assertingparty:
              entity-id: https://tumidp.lrz.de/idp/shibboleth
              metadata-uri: https://login.tum.de/idp/shibboleth


  flyway:
    baseline-on-migrate: true
    baseline-version: 1

  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5433}/${POSTGRES_DB:workshopper}}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:workshopper}
    password: ${POSTGRES_PASSWORD:workshopper}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  servlet:
    multipart:
      # PowerPoint templates with images are often several MB
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        # The login cookie is not sent with requests started by other sites
        same-site: lax
        http-only: true

# ── LLM Configuration ──────────────────────────────────────────────
# We use the shared Hestia LLM defaults (spring.ai.openai properties): the TUM AET Logos gateway
# with openai/gpt-oss-120b. A secondary model must be a Logos model id as well.
spring.ai.openai.api-key: ${WORKSHOPPER_LOGOS_API_KEY}

# A model call that hangs must fail instead of blocking the request (and the session's generation
# lock) indefinitely. The read timeout applies to every HTTP call the server makes through Spring's
# RestClient, which is how Spring AI reaches the model. Spring AI's default retry (10 attempts,
# waits growing 5x up to 3 minutes) is cut to one retry, so a failing call ends within ~3 minutes.
spring.http.client:
  connect-timeout: 10s
  read-timeout: ${LLM_READ_TIMEOUT:90s}
spring.ai.retry:
  max-attempts: 2
  backoff:
    initial-interval: 2s
    multiplier: 2
    max-interval: 10s

llm:
  secondary-model: ${LLM_SECONDARY_MODEL:}

logging:
  level:
    com.workshopper: INFO
