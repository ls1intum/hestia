# Full-stack deployment for learninggoalhub: postgres + Spring server + nginx web.
# Only the web container is reachable from outside (via the shared Traefik proxy);
# postgres and server stay on the internal network.
#
# Images are built and pushed to GHCR by CI (.github/workflows/learninggoalhub-cicd.yml)
# and deployed by tag — this file references them by ${IMAGE_TAG}, it does NOT build.
# Manual deploy/refresh on the VM (CI does the same via the reusable deploy workflow):
#
#   docker compose -f compose.prod.yaml --env-file .env pull
#   docker compose -f compose.prod.yaml --env-file .env up -d
#
# See DEPLOY.md. For local dev (DB only) use compose.yaml instead.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learninggoalhub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-learninggoalhub}
      POSTGRES_USER: ${POSTGRES_USER:-learninggoalhub}
      POSTGRES_PASSWORD: ${LEARNINGGOALHUB_POSTGRES_PASSWORD:?set LEARNINGGOALHUB_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learninggoalhub} -d ${POSTGRES_DB:-learninggoalhub}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    image: ghcr.io/ls1intum/hestia/learninggoalhub/server:${IMAGE_TAG:-latest}
    container_name: learninggoalhub-server
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-learninggoalhub}
      POSTGRES_USER: ${POSTGRES_USER:-learninggoalhub}
      POSTGRES_PASSWORD: ${LEARNINGGOALHUB_POSTGRES_PASSWORD:?set LEARNINGGOALHUB_POSTGRES_PASSWORD in .env}
      LOGOS_API_KEY: ${LEARNINGGOALHUB_LOGOS_API_KEY:?set LEARNINGGOALHUB_LOGOS_API_KEY in .env}
      # Keys the ExamLens and Workshopper servers send in X-Api-Key; see DEPLOY.md.
      API_KEY_EXAMLENSE: ${LEARNINGGOALHUB_API_KEY_EXAMLENSE:-}
      API_KEY_WORKSHOPPER: ${LEARNINGGOALHUB_API_KEY_WORKSHOPPER:-}
      ENFORCE_SERVICE_KEYS: ${LEARNINGGOALHUB_ENFORCE_SERVICE_KEYS:-false}
      # `local` turns on DevAuthFilter (no TUM login). Only on hestia-test, which TUM login
      # does not know; never on production.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70}
      SAML_PRIVATE_KEY_LOCATION: file:/app/certs/private-key.pem
      SAML_CERTIFICATE_LOCATION: file:/app/certs/certificate.crt
    volumes:
      - /opt/hestia/secrets/saml:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    # Actuator health covers the database connection. The start period leaves room for boot
    # (Flyway, Tika); the CI smoke test waits on this status after a deploy.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s
    # Cap memory on the shared ≈4 GB VM; heap is 70% of this (see server Dockerfile).
    mem_limit: 1500m
    restart: unless-stopped

  web:
    image: ghcr.io/ls1intum/hestia/learninggoalhub/client:${IMAGE_TAG:-latest}
    container_name: learninggoalhub-web
    # No host ports: the shared Traefik proxy (infra/traefik) owns 80/443 and terminates
    # TLS. This container only needs to be reachable by Traefik on the shared edge network.
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      server:
        condition: service_healthy
    networks:
      - default        # private: reach this app's own server (and via it, postgres)
      - hestia-edge    # shared: receive traffic from Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hestia-edge"
      # Route https://${APP_HOST}/learninggoalhub/... to this app; Traefik strips the
      # prefix (and sends X-Forwarded-Prefix) so nginx stays prefix-agnostic.
      - "traefik.http.routers.learninggoalhub.rule=Host(`${APP_HOST}`) && PathPrefix(`/learninggoalhub`)"
      - "traefik.http.routers.learninggoalhub.entrypoints=websecure"
      - "traefik.http.routers.learninggoalhub.tls=true"
      - "traefik.http.routers.learninggoalhub.middlewares=learninggoalhub-strip"
      - "traefik.http.middlewares.learninggoalhub-strip.stripprefix.prefixes=/learninggoalhub"
      - "traefik.http.services.learninggoalhub.loadbalancer.server.port=80"
    restart: unless-stopped

  # Daily pg_dump of the database into a host directory, outside the postgres volume, so a
  # removed volume or a bad migration can be rolled back. Keeps BACKUP_KEEP_DAYS days of
  # dumps. Same image as postgres, so pg_dump matches the server version. Restore: DEPLOY.md.
  backup:
    image: pgvector/pgvector:pg16
    container_name: learninggoalhub-backup
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-learninggoalhub}
      PGUSER: ${POSTGRES_USER:-learninggoalhub}
      PGPASSWORD: ${LEARNINGGOALHUB_POSTGRES_PASSWORD:?set LEARNINGGOALHUB_POSTGRES_PASSWORD in .env}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ${BACKUP_DIR:-/opt/hestia/backups/learninggoalhub}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          file=/backups/learninggoalhub-$$(date +%Y%m%d-%H%M%S).dump
          # Old dumps are pruned only after a new one was written, so a run of failures never
          # deletes the last good backups.
          if pg_dump -Fc -f "$$file.partial"; then
            mv "$$file.partial" "$$file"
            echo "backup written: $$file"
            find /backups -name 'learninggoalhub-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          else
            rm -f "$$file.partial"
            echo "backup FAILED" >&2
          fi
          sleep 86400
        done
    restart: unless-stopped

networks:
  # Shared, created once on the VM: `docker network create hestia-edge`.
  hestia-edge:
    external: true

volumes:
  postgres-data:
