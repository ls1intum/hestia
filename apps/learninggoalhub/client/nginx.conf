# Preserve the original external scheme. Behind the shared TLS-terminating proxy the hop to
# this nginx is plain http, so $scheme is "http"; honour the proxy's X-Forwarded-Proto
# (https) when present so the server advertises https URLs (e.g. in the OpenAPI spec).
map $http_x_forwarded_proto $fwd_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic hardening for every response. A location with its own add_header drops these, so the
    # client location below repeats them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Single-page app: serve index.html for client-side routes. The CSP covers the client's own
    # pages only; the proxied SAML and Swagger pages below come from Spring with their own scripts.
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # PDF.js loads its worker as an ES module. nginx's default MIME map does not
    # cover .mjs, and browsers reject module scripts served as application/octet-stream.
    location ~ \.mjs$ {
        types { application/javascript mjs; }
        try_files $uri =404;
    }

    # API proxied to the Spring server (same Docker network). Use the unique container name,
    # not the compose service name: this container also sits on the shared hestia-edge network,
    # where another app's `server` service would shadow the generic alias.
    location /api/ {
        proxy_pass http://learninggoalhub-server:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $host;
        # The edge proxy strips the app's path prefix and passes it here; forward it so
        # springdoc advertises correct absolute URLs (Swagger "Try it out" base path).
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;

        # Document uploads are large (multipart up to 500 MB) and extraction is slow.
        client_max_body_size 500m;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
    }

    # OpenAPI spec, Swagger UI, and SAML auth (served by spring/security on the server, outside /api).
    location ~ ^/(v3/api-docs|swagger-ui|saml2|login/saml2/sso) {
        proxy_pass http://learninggoalhub-server:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
    }
}
