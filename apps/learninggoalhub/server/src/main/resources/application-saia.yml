# Run against GWDG SAIA instead of the default TUM AET Logos gateway. Activate with
# SPRING_PROFILES_ACTIVE=saia; without it nothing here applies and Logos stays the default.
#
# Both gateways speak the OpenAI API, so only the key and the model ids belong here: the endpoint
# and the chat/vision defaults come from libs/shared-llm, which reads the same profile. SAIA serves
# chat and embeddings from one endpoint, so its key covers both.
spring:
  ai:
    openai:
      api-key: ${SAIA_API_KEY:}
      embedding:
        api-key: ${SAIA_API_KEY:}

hestia:
  figures:
    vision-model: qwen3.6-35b-a3b
  title:
    vision-model: qwen3.6-35b-a3b
  bookmark:
    judge-model: openai-gpt-oss-120b
  document-outline:
    model: openai-gpt-oss-120b
  extraction:
    taxonomy-planner-model: openai-gpt-oss-120b
    taxonomy-partition-model: openai-gpt-oss-120b
