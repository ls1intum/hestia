# Preserve the original external scheme. Behind the shared TLS-terminating proxy the hop to
# this nginx is plain http, so $scheme is "http"; honour the proxy's X-Forwarded-Proto
# (https) when present so the server advertises https URLs (e.g. signed storage links).
map $http_x_forwarded_proto $fwd_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Resolve the real client address here, so the server gets one it can trust.
#
# The server cannot work this out for itself: Spring's ForwardedHeaderFilter
# (server.forward-headers-strategy=framework, needed for https URL generation) runs
# before application code, hides the X-Forwarded-* headers, and sets remoteAddr from
# the LEFTMOST X-Forwarded-For entry — which the client supplies. Every per-IP limit
# read from that is evadable with one header.
#
# `real_ip_recursive off` is deliberate: with it on, nginx walks the chain from the
# right skipping trusted addresses, and since ExamLense is VPN-only its clients have
# private addresses that would themselves be "trusted" and skipped, landing back on a
# forged entry. Off, nginx takes the last entry of the header as it arrived from
# Traefik — which is the address Traefik observed, i.e. the real client. Anything the
# client prepended sits to the left of it and is ignored.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header    X-Forwarded-For;
real_ip_recursive off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: serve index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxied to the Spring server. Addressed by container_name rather than the compose
    # service name `server`: this container also joins the shared `hestia-edge` network, where
    # a bare `server` could resolve to another app's backend.
    location /api/ {
        proxy_pass http://examlense-server:8081;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        # Overwritten, never appended: whatever the client sent under this name is
        # discarded, which is what makes it trustworthy on the server side.
        proxy_set_header X-Client-Ip        $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $fwd_proto;
        proxy_set_header X-Forwarded-Host   $host;
        # The edge proxy strips the app's path prefix and passes it here; forward it so the
        # server can build correct absolute URLs (signed storage links).
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;

        # PDF uploads are multipart (Spring caps request size at 12MB); leave headroom.
        client_max_body_size 20m;
        # AI parsing/solving is slow; SSE streams must stay open and unbuffered.
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_buffering      off;
    }

    # SAML authentication endpoints (served by spring/security on the server, outside /api).
    location ~ ^/(saml2|login/saml2/sso) {
        proxy_pass http://examlense-server:8081;
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        # Overwritten, never appended: whatever the client sent under this name is
        # discarded, which is what makes it trustworthy on the server side.
        proxy_set_header X-Client-Ip        $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $fwd_proto;
        proxy_set_header X-Forwarded-Host   $host;
        proxy_set_header X-Forwarded-Prefix $http_x_forwarded_prefix;
    }
}
