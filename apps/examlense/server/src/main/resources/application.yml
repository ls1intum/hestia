server:
  port: ${PORT:8081}
  forward-headers-strategy: framework

spring:
  application:
    name: examlense-server
  security:
    saml2:
      relyingparty:
        registration:
          tum:
            signing:
              credentials:
                - private-key-location: ${SAML_PRIVATE_KEY_LOCATION:classpath:certs/private-key.pem}
                  certificate-location: ${SAML_CERTIFICATE_LOCATION:classpath:certs/certificate.crt}
            assertingparty:
              entity-id: https://tumidp.lrz.de/idp/shibboleth
              metadata-uri: https://login.tum.de/idp/shibboleth
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/examlense}
    username: ${DB_USER:examlense}
    password: ${DB_PASSWORD:examlense}
  jpa:
    hibernate:
      ddl-auto: validate        # Flyway owns the schema; Hibernate only validates entity ↔ table parity
    open-in-view: false
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

storage:
  local:
    base-path: ${STORAGE_LOCAL_BASE_PATH:./data/storage}

learninggoalhub:
  base-url: ${LGH_BASE_URL:https://hestia-test.aet.cit.tum.de/learninggoalhub}

ai:
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}

# OpenAPI spec + Swagger UI. Off by default so deployments expose no docs surface;
# the `local` profile turns them on. app.docs.enabled drives the SecurityConfig
# matchers from the same switch, so the two can't drift out of sync.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

app:
  docs:
    enabled: ${API_DOCS_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}
  auth:
    # Pre-multi-user shared token, kept as a bootstrap/dev path: it authenticates
    # as the seeded legacy user (see app.shared.DefaultUser). Deployments MUST set
    # this empty once real users are enrolled — while it is set it is a shared
    # identity that bypasses per-user isolation. The server logs a warning on boot.
    token: ${API_AUTH_TOKEN:dev-local-token}
    # Bootstrap credential that grants ADMIN, as the legacy user. Deliberately a
    # SEPARATE secret from app.auth.token above: that one is committed (it ships in
    # .env.example and client/.env.production), so admin behind it would be admin
    # for anyone who reads the repo. No default — unset means the only route to
    # admin is users.is_admin. Set it once to enrol and promote yourself, then unset.
    admin-token: ${ADMIN_BOOTSTRAP_TOKEN:}
    # Lifetime of a minted session token. Interim auth is not meant to outlive SAML.
    token-ttl-days: ${AUTH_TOKEN_TTL_DAYS:180}
    # Open registration: a first visit creates an account with nothing asked of the
    # user. Turn off to freeze the instance to existing token holders.
    open-registration: ${OPEN_REGISTRATION:true}
    # New accounts per IP per day. Without a cap, clearing browser storage mints a
    # fresh account with a fresh LLM quota, which would make per-user metering
    # pointless and the provider bill unbounded.
    registrations-per-ip-per-day: ${REGISTRATIONS_PER_IP_PER_DAY:5}
    # How long a resolved token stays cached in-process. Bounds the database hit
    # rate (the per-IP limiter admits 300 req/10s, and SSE re-authenticates on
    # every async re-dispatch); the trade is that a revoke takes this long to bite.
    principal-cache-seconds: ${AUTH_PRINCIPAL_CACHE_SECONDS:60}
  # Per-user LLM metering. Rolling 24h windows, counted in the database so a
  # restart doesn't reset anyone's quota.
  quota:
    parse-per-day: ${QUOTA_PARSE_PER_DAY:20}
    solve-per-day: ${QUOTA_SOLVE_PER_DAY:20}
    # Instance-wide ceilings, across every account. The per-user quotas above bound
    # nothing on their own: registration is open, so a used-up account can be traded
    # for a fresh allowance. These are counted from actual usage, so neither account
    # churn nor a forged proxy header moves them — this is the real cap on spend.
    global-parse-per-day: ${QUOTA_GLOBAL_PARSE_PER_DAY:200}
    global-solve-per-day: ${QUOTA_GLOBAL_SOLVE_PER_DAY:200}
  files:
    # HMAC key for signed file URLs. Keep separate from the auth token; when
    # unset the backend falls back to the token and logs a warning.
    signing-secret: ${FILES_SIGNING_SECRET:}
  # Coarse per-IP bot/overload protection. Deliberately kept alongside the
  # per-user quota above: this runs BEFORE authentication, so it is the only
  # thing that can cheaply reject unauthenticated floods and invite guessing.
  ratelimit:
    requests: ${API_RATELIMIT_REQUESTS:300}
    window-seconds: ${API_RATELIMIT_WINDOW_SECONDS:10}
    # Trust X-Forwarded-For for client IPs only when behind a reverse proxy.
    behind-proxy: ${API_RATELIMIT_BEHIND_PROXY:false}
    # How many entries our own proxies APPEND to X-Forwarded-For. In the deployed
    # topology that is 2 (Traefik appends the client's address, then nginx appends
    # Traefik's). Must match reality: too low reads a client-supplied value and every
    # per-IP limit becomes evadable; too high reads our own proxy's address, which is
    # identical for everyone and collapses per-IP limits into global ones.
    trusted-proxy-hops: ${API_RATELIMIT_TRUSTED_PROXY_HOPS:2}

logging:
  level:
    org.springframework.security: INFO
