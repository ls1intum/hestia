# Full-stack deployment for ExamLense: postgres + Spring server + nginx web.
# Only the web container is reachable from outside (via the shared Traefik proxy);
# postgres stays on the internal network. The server also joins hestia-edge so
# it can call LearningGoalHub's web container over Docker DNS instead of
# hairpinning through the public Traefik URL.
#
# Images are built and pushed to GHCR by CI (.github/workflows/examlense-cicd.yml)
# and deployed by tag — this file references them by ${IMAGE_TAG}, it does NOT build.
# Manual deploy/refresh on the VM (CI does the same via the reusable deploy workflow):
#
#   docker compose -f compose.prod.yaml --env-file .env pull
#   docker compose -f compose.prod.yaml --env-file .env up -d
#
# See DEPLOY.md. For local dev (DB only) use docker-compose.yml instead.

services:
  postgres:
    image: postgres:16
    container_name: examlense-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examlense}
      POSTGRES_USER: ${POSTGRES_USER:-examlense}
      POSTGRES_PASSWORD: ${EXAMLENSE_POSTGRES_PASSWORD:?set EXAMLENSE_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examlense} -d ${POSTGRES_DB:-examlense}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  server:
    image: ghcr.io/ls1intum/hestia/examlense/server:${IMAGE_TAG:-latest}
    container_name: examlense-server
    environment:
      # application.yml reads DB_URL / DB_USER / DB_PASSWORD (Flyway owns the schema; a fresh
      # DB is built on first boot). Postgres is reachable by service name on the private net.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-examlense}
      DB_USER: ${POSTGRES_USER:-examlense}
      DB_PASSWORD: ${EXAMLENSE_POSTGRES_PASSWORD:?set EXAMLENSE_POSTGRES_PASSWORD in .env}
      # AI providers. Each app namespaces its own secrets in the shared deploy
      # environment, hence the EXAMLENSE_ prefix on every key below.
      # OpenAI native API — powers gpt-* parser/solver strategies.
      OPENAI_API_KEY: ${EXAMLENSE_OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # Anthropic native API — powers claude-* parser/solver strategies.
      ANTHROPIC_API_KEY: ${EXAMLENSE_ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      # Google Gemini (native API) — powers the gemini-* PDF_DIRECT parser strategies.
      # Optional: leave unset to disable those strategies (they 500 with a clear message
      # if selected without a key). Base URL defaults to the public endpoint.
      GEMINI_API_KEY: ${EXAMLENSE_GEMINI_API_KEY:-}
      # LearningGoalHub base URL (goal derivation per exam task + course/goal reads).
      # On the shared VM, call LGH's nginx container over Docker DNS instead of
      # hairpinning through the public Traefik URL.
      LGH_BASE_URL: ${LGH_BASE_URL:-http://learninggoalhub-web}
      # SHARED bootstrap token — must match the value baked into the client build.
      # Anyone presenting it authenticates as the seeded legacy user, which bypasses
      # per-user isolation, and it ships inside the client bundle. Use it once to mint
      # set up, then set EXAMLENSE_API_AUTH_TOKEN to an empty value and redeploy.
      # See DEPLOY.md → "Enrolling users". The server warns on boot while it is set.
      # `-` not `:-` on purpose: with `:-` an empty value would fall back to the
      # default, so the shared token could never actually be switched off.
      API_AUTH_TOKEN: ${EXAMLENSE_API_AUTH_TOKEN-dev-local-token}
      # SEPARATE secret that grants ADMIN (as the legacy user), so that the shared
      # token above — which is committed to this public repository — cannot administer
      # anything. Set it as a GitHub secret, use it once to enrol and promote your real
      # account via /admin, then unset it. No default: unset means the only route to
      # admin is the users.is_admin flag.
      ADMIN_BOOTSTRAP_TOKEN: ${EXAMLENSE_ADMIN_BOOTSTRAP_TOKEN:-}
      # Open registration: a first visit creates an account with nothing asked of the
      # user. Anyone who can reach the host can get one — that is the intended trade
      # behind the VPN. Set false to freeze the instance to existing token holders.
      OPEN_REGISTRATION: ${EXAMLENSE_OPEN_REGISTRATION:-true}
      # New accounts per IP per day. Load-bearing: without it, clearing browser storage
      # mints an account with a fresh LLM quota, so per-user metering would bound nothing.
      REGISTRATIONS_PER_IP_PER_DAY: ${EXAMLENSE_REGISTRATIONS_PER_IP_PER_DAY:-5}
      # Per-user LLM job caps over a rolling 24h window.
      QUOTA_PARSE_PER_DAY: ${EXAMLENSE_QUOTA_PARSE_PER_DAY:-20}
      QUOTA_SOLVE_PER_DAY: ${EXAMLENSE_QUOTA_SOLVE_PER_DAY:-20}
      # Instance-wide ceilings. The per-user quotas above are a fairness control and
      # bound nothing on their own — registration is open, so a used-up account can be
      # traded for a fresh allowance. These count actual usage, so neither account churn
      # nor a forged proxy header moves them. This is the real cap on the provider bill.
      QUOTA_GLOBAL_PARSE_PER_DAY: ${EXAMLENSE_QUOTA_GLOBAL_PARSE_PER_DAY:-200}
      QUOTA_GLOBAL_SOLVE_PER_DAY: ${EXAMLENSE_QUOTA_GLOBAL_SOLVE_PER_DAY:-200}
      # Dedicated HMAC key for signed file URLs. Required in production: when unset the
      # server falls back to API_AUTH_TOKEN, which ships inside the client bundle — so
      # anyone could mint valid file URLs. Fail the deploy rather than start up forgeable.
      FILES_SIGNING_SECRET: ${EXAMLENSE_FILES_SIGNING_SECRET:?set EXAMLENSE_FILES_SIGNING_SECRET in the GitHub environment}
      # Behind Traefik: client IPs arrive via X-Forwarded-For, so let the rate
      # limiter trust it here (never enable without a proxy in front).
      API_RATELIMIT_BEHIND_PROXY: ${API_RATELIMIT_BEHIND_PROXY:-true}
      # How many entries our own proxies APPEND to X-Forwarded-For: Traefik appends the
      # client's address, then this app's nginx appends Traefik's (it uses
      # $$proxy_add_x_forwarded_for). Must match the real chain — too low reads a value
      # the client supplied and every per-IP limit becomes evadable with one header; too
      # high reads our own proxy's address, identical for everyone, which collapses
      # per-IP limits into global ones. Revisit if the edge topology changes.
      API_RATELIMIT_TRUSTED_PROXY_HOPS: ${API_RATELIMIT_TRUSTED_PROXY_HOPS:-2}
      # Same-origin behind Traefik; allow the public host for any non-proxied call.
      CORS_ALLOWED_ORIGINS: https://${APP_HOST}
      # Uploaded files live on a named volume (survives redeploys).
      STORAGE_LOCAL_BASE_PATH: /app/data/storage
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70}
      SAML_PRIVATE_KEY_LOCATION: file:/app/certs/private-key.pem
      SAML_CERTIFICATE_LOCATION: file:/app/certs/certificate.crt
    volumes:
      - examlense-storage:/app/data
      - /opt/hestia/secrets/saml:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default        # private: reach this app's own postgres
      - hestia-edge    # shared: reach learninggoalhub-web by Docker DNS
    # Cap memory on the shared ≈4 GB VM; heap is 70% of this (see server Dockerfile).
    mem_limit: 1500m
    restart: unless-stopped

  web:
    image: ghcr.io/ls1intum/hestia/examlense/client:${IMAGE_TAG:-latest}
    container_name: examlense-web
    # No host ports: the shared Traefik proxy (infra/traefik) owns 80/443 and terminates
    # TLS. This container only needs to be reachable by Traefik on the shared edge network.
    expose:
      - "80"
    depends_on:
      - server
    networks:
      - default        # private: reach this app's own server (and via it, postgres)
      - hestia-edge    # shared: receive traffic from Traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hestia-edge"
      # Route https://${APP_HOST}/examlense/... to this app; Traefik strips the prefix (and
      # sends X-Forwarded-Prefix) so nginx stays prefix-agnostic. The prefix is HARDCODED to
      # /examlense here — NOT read from ${APP_PATH_PREFIX}, which is a shared per-environment
      # variable owned by another app (=/learninggoalhub). It also matches the client build
      # (vite `base` + .env.production). Only APP_HOST (the VM FQDN) is a shared variable.
      - "traefik.http.routers.examlense.rule=Host(`${APP_HOST}`) && PathPrefix(`/examlense`)"
      - "traefik.http.routers.examlense.entrypoints=websecure"
      - "traefik.http.routers.examlense.tls=true"
      - "traefik.http.routers.examlense.middlewares=examlense-strip"
      - "traefik.http.middlewares.examlense-strip.stripprefix.prefixes=/examlense"
      - "traefik.http.services.examlense.loadbalancer.server.port=80"
    restart: unless-stopped

networks:
  # Shared, created once on the VM: `docker network create hestia-edge`.
  hestia-edge:
    external: true

volumes:
  postgres-data:
  examlense-storage:
