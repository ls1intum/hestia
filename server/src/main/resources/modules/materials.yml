# Settings of the materials module (formerly the LearningGoalHub server).

hestia:
  figures:
    # Vision model used to describe eligible text-poor slide pages during extraction.
    vision-model: Qwen/Qwen3.8-27B
    # Concurrent page-description calls. Below the text phases' width: each call carries several
    # rendered pages, so a wide burst of them draws 429s and the oversized payloads also provoke
    # 500s. This is spent on batches within a document, not on documents — spread across documents
    # it did nothing for a course of two large PDFs, which is how this phase came to be 62% of a
    # measured run while never once being rate-limited.
    parallelism: 8
  title:
    # Whether to name bookmark-less PDFs with the vision model below. Off → every such document falls
    # back to its filename, with no VLM call during upload. Disabled for now because the vision model
    # can stall the (synchronous) upload when the gateway is overloaded or the model is unavailable.
    enabled: false
    # Vision model that names a bookmark-less PDF (slide deck/exercise) from its first rendered
    # pages. A VLM reads the slide layout to tell the session topic from the repeated course banner,
    # which flat text extraction cannot. On any failure the session falls back to the filename.
    vision-model: Qwen/Qwen3.8-27B
  bookmark:
    # Text model that judges whether a PDF's top-level bookmarks are separate course units (split into
    # a session each) or one lecture's internal outline (treat as a single session). Only the grey
    # zone reaches it — PowerPoint per-slide/default-section exports are filtered out mechanically; on
    # any failure the document is split, the original bookmark behaviour.
    judge-model: openai/gpt-oss-120b
    # The judge runs inside the upload request. A gateway that does not answer would hold the upload
    # for the whole retry ladder (minutes at "Uploading… 60%"), so the judge gives up after this and
    # splits. A healthy reply takes a few seconds.
    judge-timeout: 30s
  extraction:
    # Concurrent session calls. Sixteen once burst the provider badly enough to be cut to four, but
    # that was when a call carried a whole section — up to the old 80,000-character budget. Units are
    # now capped at unit-max-chars below, so a call is a fraction of that payload and sixteen of them
    # are a smaller burst than four used to be. Transient 429/5xx also retry with jittered backoff
    # now, which they did not when four was chosen. Sixteen is the pre-#66 width, restored on the
    # smaller payload: watch a run's logs for 429s before treating it as settled.
    parallelism: 16
    # The budget for one extraction call, and the pipeline's granularity knob. A section longer
    # than this is cut into page-aligned windows that share its session; 0 sends every section
    # whole, which makes the tree's size depend on how the uploader split their PDFs.
    unit-max-chars: 12000
    # Characters per skill; a unit's allowance is its length over this, floor 1, ceiling 4.
    skill-target-chars: 3000
    # The same for units of documents uploaded as exercises, calibrated apart from lectures.
    exercise-skill-target-chars: 3000
    # Whether a SESSION/EXERCISE node that produced no goals is kept instead of pruned. On, a lecture
    # that teaches no performance stays visible as an empty unit — which is the measurement when
    # skills are contracted to APPLY or above. Off, the tree shows only what was extracted.
    keep-empty-units: false
    # Keep generation consistent across evaluation runs; temperature 0 can make systematic omissions
    # repeat identically, so text generation stays at 0.2 while assignment/classification uses 0.0.
    temperature: 0.2
    assignment-temperature: 0.0
    # Model for the competency tree: naming the course's topics, assigning skills to them, and
    # structuring each topic into capabilities. All three calls run at assignment-temperature.
    taxonomy-planner-model: openai/gpt-oss-120b
  security:
    # Shared keys the other Hestia apps' servers send in X-Api-Key (one per caller). Blank = none.
    api-key:
      examlense: ${API_KEY_EXAMLENSE:}
      workshopper: ${API_KEY_WORKSHOPPER:}
    # Whether the service-only endpoints (exam tasks, by-session) require a key. On in deployments
    # (compose.prod.yaml); off, any logged-in caller reaches them and the server logs each request
    # it would reject ("Would reject ...").
    enforce-service-keys: ${ENFORCE_SERVICE_KEYS:false}
  rate-limit:
    # Requests that start model calls, per client address and window; more get a 429. Requests
    # with a service key are not counted.
    llm-requests: 60
    window: 10m
  upload:
    # Bounds on one uploaded PDF, checked after parsing. A whole-semester slide collection reaches
    # about 600 pages and 350,000 characters, so these only stop files that would otherwise tie up
    # the parser and the extraction for a long time.
    max-pages: 2000
    max-text-chars: 3000000
  topic-search:
    # Most pages one "Find in the slides" search may read. Each page range is extracted like a
    # session, so this caps the calls and the wait of a single search.
    max-pages: 80
